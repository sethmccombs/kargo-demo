apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: product
  name: product
  namespace: east
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product
        topology.kubernetes.io/region: east
    spec:
      containers:
      - image: public.ecr.aws/nginx/nginx:1.31.6
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        name: product
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
