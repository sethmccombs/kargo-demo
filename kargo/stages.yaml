apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: product
  annotations:
    kargo.akuity.io/color: "#2E7D32"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: product
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - task:
            name: demo-promo-process
          as: promo-process
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: product
  annotations:
    kargo.akuity.io/color: "#EF6C00"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: product
      sources:
        stages:
          - dev
  verification:
    analysisTemplates:
      - name: product-http-check
  promotionTemplate:
    spec:
      steps:
        - task:
            name: demo-promo-process
          as: promo-process
---
apiVersion: kargo.akuity.io/v1alpha1
