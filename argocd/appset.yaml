apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # Named `kargo-product` (not `product`) to avoid colliding with the sibling
  # argocd-demo repo's own `product` ApplicationSet in the same argocd namespace.
  name: kargo-product
  namespace: argocd
spec:
  # One Argo CD Application per Kargo Stage. Each tracks the stage-specific
  # branch (`stage/<stage>`) that Kargo's PromotionTask renders and pushes.
  #
  # ACTIVE generator: a simple list (dev/east/west).
  generators:
    - list:
        elements:
          - stage: dev
            namespace: dev
          - stage: east
            namespace: east
          - stage: west
            namespace: west
  #
  # ALTERNATIVE (demo): drive the same Applications from a YAML list in this
  # repo using the ApplicationSet *Git* generator. To try it, comment-out the
  # `list` generator above and uncomment the block below:
  #
  # generators:
  #   - git:
  #       repoURL: https://github.com/sethmccombs/kargo-demo.git
  #       revision: main
  #       files:
  #         - path: argocd/regions.yaml
  #
  # regions.yaml is a YAML list, one entry per region/stage. The Git generator
  # iterates it and exposes the same `{{stage}}`/`{{namespace}}` params as the
  # active list generator, so swapping the generator type needs NO template
  # change — a clean way to show how regions/environments can be added in Git
  # without editing the ApplicationSet itself.
  template:
    metadata:
      name: kargo-product-{{stage}}
      annotations:
        kargo.akuity.io/authorized-stage: product:{{stage}}
    spec:
      project: application
      source:
        repoURL: https://github.com/sethmccombs/kargo-demo.git
        targetRevision: stage/{{stage}}
        path: .
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true